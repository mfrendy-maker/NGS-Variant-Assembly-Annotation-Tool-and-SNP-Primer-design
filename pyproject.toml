[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ngs-variant-assembly-annotation-tool"
version = "0.1.0"
description = "End-to-end NGS workflow for FASTQ processing, read assembly, variant calling, annotation, and primer design."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "mfrendy-maker" }]
dependencies = [
    "matplotlib>=3.7",
    "pandas>=2.0",
    "streamlit>=1.36",
]

[project.scripts]
ngs-variant-tool = "ngs_variant_assembly_annotation_tool.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
